name: Audit library integrity weekly

on:
  schedule:
    # Каждую пятницу в 09:07 UTC — после накопления недельной партии.
    - cron: "7 9 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: skill-harvester-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Audit library (dry run)
        run: python scripts/audit_library.py --dry

      - name: Commit audit report
        run: |
          if [ -z "$(git status --porcelain data/reports)" ]; then
            echo "No audit report changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports
          git commit -m "chore: weekly library audit report"
          git push

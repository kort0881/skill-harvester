name: Collect new GitHub skills weekly

on:
  schedule:
    # Каждое воскресенье в 06:17 UTC.
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum candidates to collect"
        required: false
        default: "40"

permissions:
  contents: write

concurrency:
  group: skill-harvester-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect skill candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_CANDIDATES_PER_RUN: ${{ inputs.limit || '40' }}
        run: python run.py collect --limit "${MAX_CANDIDATES_PER_RUN}"

      - name: Build library README
        run: python run.py build-readme

      - name: Commit collected candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data library
          git diff --cached --quiet || git commit -m "chore: collect weekly skill candidates"
          git push

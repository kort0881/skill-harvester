# Целевой профиль: для кого собирается библиотека.
#
# Навык оценивается не «вообще полезный», а «нужный нашему стеку». Домен без
# попаданий не тянет оценку вверх; балл fit считается по лучшему домену
# (см. scripts/integrity.py → fit_score).
enabled: true


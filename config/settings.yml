project:
  name: skill-harvester
  library_title: Curated Agent Skills Library

collection:
  max_candidates_per_run: 40
  min_repo_stars: 0
  max_skill_file_size_bytes: 180000
  accepted_skill_filenames:
    - SKILL.md
    - skill.md
  skip_archived_repositories: true
  skip_forks: false
  languages:
    - English
    - Russian
    - Any
  # Навык качается вместе с папкой: скрипты, references, шаблоны.
  # Без этого в библиотеку попадали записи со ссылками на несуществующие файлы.
  bundle:
    max_total_bytes: 400000
    max_files: 40
    max_file_bytes: 65536

# Детерминированные сита до обращения к модели. Дёшево и воспроизводимо.
gates:
  require_complete_bundle: true     # ссылки на scripts/references обязаны существовать
  use_target_profile: true          # оценивать не «полезно вообще», а «нужно нам»
  minimum_fit_score: 35
  max_promo_hits: 0                 # gumroad, «buy now», $29 и прочая торговля
  near_duplicate_similarity: 0.72   # жаккар по словам против уже принятых

analysis:
  max_per_run: 12
  minimum_total_score: 72
  minimum_quality_score: 65
  minimum_uniqueness_score: 55
  min_content_characters: 250
  allow_model_rewrite: true
  reject_if_security_risk: true

consolidation:
  max_groups_per_run: 5
  minimum_similarity: 0.72
  candidate_limit_per_category: 120
  keep_original_sources: true

github:
  # GitHub Code Search API only supports sort=indexed (best_match otherwise).
  # Do not set this to "updated" - the API will reject the request.
  search_sort: indexed
  search_order: desc
  request_timeout_seconds: 30
  max_pages_per_query: 3
